# Base URL for FakeStore API
product.fakestore.base-url=https://fakestoreapi.com

server.port=8080
logging.level.org.springframework.security=DEBUG

# Timeouts (ms)
product.fakestore.timeout-connect-ms=800
product.fakestore.timeout-read-ms=3000

# HTTP client pool settings
product.fakestore.http-client-max-connect-pool=200
product.fakestore.http-client-max-connect-per-route=20

# Idle connection timeout
product.fakestore.http-idle-connection-timeout-ms=30000

# JDBC connection
spring.datasource.url=jdbc:mysql://localhost:3306/product_catalog?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=dev
spring.datasource.password=dev
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate JPA
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hikari settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000


# --- Standalone Redis ---
spring.data.redis.host=localhost
spring.data.redis.port=6379
#spring.data.redis.password=your_password   # optional
spring.data.redis.database=0
spring.data.redis.timeout=5s
spring.data.redis.ssl.enabled=false
